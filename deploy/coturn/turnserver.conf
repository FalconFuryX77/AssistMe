# ==============================================================================
# Coturn STUN & TURN Relay Server Configuration for AssistMe
# ==============================================================================

# Listening IP and Ports
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# Dynamic UDP Relay Port Range for WebRTC media streams
min-port=49152
max-port=49200

# Realm and Authentication
realm=assistme.net
lt-cred-mech
user=assistme_turn_user:assistme_turn_secret

# Security & Fingerprinting
fingerprint
secure-stun
no-multicast-peers
no-cli

# Logging
verbose
log-file=stdout
