# ==============================================================================
# Coturn STUN & TURN Relay Server Configuration for AssistMe
# ==============================================================================

# Listening IP and Ports
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# Dynamic UDP Relay Port Range for WebRTC media streams
min-port=49152
max-port=49200

# Realm and Authentication
realm=assistme.net
lt-cred-mech
user=${TURN_USERNAME}:${TURN_CREDENTIAL}

# Security & Fingerprinting
fingerprint
secure-stun
no-multicast-peers
no-cli

# Logging
verbose
log-file=stdout

# --- Internet Deployment: External IP ---
# Set EXTERNAL_IP to the server's public IP or domain so that
# TURN relay candidates advertise a routable address.
# When deploying via Docker Compose, this is injected from the .env file.
# If EXTERNAL_IP is not set, coturn uses auto-detection (may not work behind NAT).
external-ip=${EXTERNAL_IP}
relay-ip=0.0.0.0

# Deny relay to private/loopback ranges to prevent abuse
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

