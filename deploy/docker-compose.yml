services:
  # --- FastAPI Backend Service ---
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: assistme_backend
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-development}
      - AUTO_CREATE_TABLES=${AUTO_CREATE_TABLES:-false}
      - DATABASE_URL=postgresql+asyncpg://assistme:assistme_secret_pass@db:5432/assistmedb
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production-a1b2c3d4e5f6}
      # Internal Docker-network STUN/TURN (backend health / internal signaling)
      - STUN_SERVER_1=stun:coturn:3478
      - STUN_SERVER_2=stun:stun.l.google.com:19302
      - TURN_SERVER_URL=turn:coturn:3478
      - TURN_SERVER_USERNAME=${TURN_USERNAME:-assistme_turn_user}
      - TURN_SERVER_CREDENTIAL=${TURN_CREDENTIAL:-assistme_turn_secret}
      # Public-facing URLs returned to mobile/web clients over the internet
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      # Public URLs are deployment inputs. Leave empty for local-only testing;
      # never commit a temporary tunnel hostname here.
      - PUBLIC_API_BASE_URL=${PUBLIC_API_BASE_URL:-}
      - PUBLIC_WS_BASE_URL=${PUBLIC_WS_BASE_URL:-}
      - PUBLIC_TURN_URL=${PUBLIC_TURN_URL:-}
      - PUBLIC_STUN_URLS=${PUBLIC_STUN_URLS:-}
      # Optional managed TURN provider for clients on unrelated networks.
      - METERED_API_KEY=${METERED_API_KEY:-}
      - METERED_DOMAIN=${METERED_DOMAIN:-assistme.metered.live}
      - FIREBASE_SERVICE_ACCOUNT=${FIREBASE_SERVICE_ACCOUNT:-}
      - AI_PROVIDER=${AI_PROVIDER:-mimo}
      - AI_MODEL=${AI_MODEL:-xiaomi/mimo-v2.5}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    # Keep the LAN development endpoint used by the installed Android build.
    # Nginx remains the public ingress on ports 80/443.
    ports:
      - "8000:8000"
    volumes:
      - ../backend/firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - assistme_net

  # Schema changes run once before API replicas start. In production, replace
  # this with the platform's one-shot migration job.
  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: assistme_migrate
    restart: "no"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - AUTO_CREATE_TABLES=false
      - DATABASE_URL=postgresql+asyncpg://assistme:assistme_secret_pass@db:5432/assistmedb
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production-a1b2c3d4e5f6}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - assistme_net

  # --- PostgreSQL 16 Database ---
  db:
    image: postgres:16-alpine
    container_name: assistme_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=assistme
      - POSTGRES_PASSWORD=assistme_secret_pass
      - POSTGRES_DB=assistmedb
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - assistme_net
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistme -d assistmedb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: assistme_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - assistme_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Coturn STUN / TURN Server ---
  coturn:
    image: coturn/coturn:4.6.2-alpine
    container_name: assistme_coturn
    restart: unless-stopped
    # Use envsubst to inject EXTERNAL_IP into turnserver.conf at runtime
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache gettext > /dev/null 2>&1
        envsubst < /etc/coturn/turnserver.conf.template > /etc/coturn/turnserver.conf
        exec turnserver -c /etc/coturn/turnserver.conf
    environment:
      - EXTERNAL_IP=${EXTERNAL_IP:-0.0.0.0}
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf.template:ro
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
      - "49152-49200:49152-49200/udp"
    networks:
      - assistme_net

  # --- Nginx Reverse Proxy & WebSockets Gateway ---
  nginx:
    image: nginx:1.25-alpine
    container_name: assistme_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - assistme_net

  # Stable public ingress option. Create a named Cloudflare Tunnel and set
  # its dashboard ingress target to http://backend:8000. The token is supplied
  # only at runtime; no ephemeral trycloudflare URL is used.
  cloudflared:
    image: cloudflare/cloudflared:2025.8.1
    container_name: assistme_cloudflared
    profiles: ["public-edge"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - assistme_net

networks:
  assistme_net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
