apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: assistme-ingress
  labels:
    app: assistme
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "assistme-backend-service"
spec:
  rules:
    - host: assistme.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: assistme-backend-service
                port:
                  number: 8000
