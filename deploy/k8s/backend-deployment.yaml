apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistme-backend
  labels:
    app: assistme-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: assistme-backend
  template:
    metadata:
      labels:
        app: assistme-backend
    spec:
      containers:
        - name: backend
          image: assistme-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: assistme-config
          env:
            - name: APP_ENV
              value: "production"
            - name: AUTO_CREATE_TABLES
              value: "false"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: assistme-secrets
                  key: database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: assistme-secrets
                  key: secret-key
            - name: TURN_SERVER_CREDENTIAL
              valueFrom:
                secretKeyRef:
                  name: assistme-secrets
                  key: turn-credential
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: assistme-backend-service
  labels:
    app: assistme-backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: assistme-backend
