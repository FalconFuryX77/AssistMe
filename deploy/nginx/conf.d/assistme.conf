upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name assistme.net www.assistme.net localhost;

    # Maximum file upload limit for chunked transfers
    client_max_body_size 50M;

    # --- REST API Proxy ---
    location / {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- WebSockets Real-Time Signaling Stream ---
    location /ws/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for long-running WebRTC assistance sessions
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Health check bypass
    location /health {
        proxy_pass http://backend_upstream/health;
        access_log off;
    }
}
