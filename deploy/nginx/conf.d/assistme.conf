# --- Map for WebSocket Connection header upgrade ---
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ==========================================================================
# HTTP → HTTPS Redirect (port 80)
# ==========================================================================
server {
    listen 80;
    server_name assistme.net www.assistme.net localhost _;
    set $assistme_backend http://backend:8000;

    # Allow health checks over plain HTTP (useful for load balancer probes)
    location /health {
        proxy_pass $assistme_backend;
        access_log off;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==========================================================================
# HTTPS Server (port 443) — TLS Termination
# ==========================================================================
server {
    listen 443 ssl http2;
    server_name assistme.net www.assistme.net localhost _;
    set $assistme_backend http://backend:8000;

    # --- TLS Certificates ---
    # For production: point to Let's Encrypt or your CA certificates.
    # For development: generate a self-signed cert and place in deploy/nginx/certs/
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # --- TLS Hardening ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- Security Headers ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Maximum file upload limit for chunked transfers
    client_max_body_size 50M;

    # --- REST API Proxy ---
    location / {
        proxy_pass $assistme_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- WebSockets Real-Time Signaling Stream ---
    location /ws/ {
        proxy_pass $assistme_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for long-running WebRTC assistance sessions
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Health check bypass
    location /health {
        proxy_pass $assistme_backend;
        access_log off;
    }
}
